name: Probe2 Geo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe2
        run: python probe2.py
      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe2-${{ github.run_number }}
          path: /tmp/out/probe2.json
          retention-days: 7
